<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce News Watch</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e4e8f0;
      padding: 28px 6%;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #687386;
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .toolbar {
      background: white;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #e4e8f0;
      margin-bottom: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter {
      border: 1px solid #d9deea;
      background: white;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter.active {
      background: #172033;
      color: white;
    }

    .preferences {
      background: white;
      border: 1px solid #e4e8f0;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .preferences-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .preferences-subtitle {
      color: #687386;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .preference-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .preference-column h4 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #596579;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .preference-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f2f6;
      font-size: 13px;
    }

    .preference-item:last-child {
      border-bottom: 0;
    }

    .preference-score {
      font-weight: 700;
      white-space: nowrap;
    }

    .positive { color: #18794e; }
    .negative { color: #b42318; }
    .neutral { color: #687386; }

    .blocked {
      display: inline-block;
      margin: 4px 6px 0 0;
      padding: 6px 9px;
      border-radius: 8px;
      background: #fff0f0;
      color: #b42318;
      font-size: 12px;
    }

    .personalisation-note {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #edf0f4;
      color: #687386;
      font-size: 12px;
    }

    .article {
      background: white;
      border: 1px solid #e4e8f0;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 18px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .article:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(20, 30, 50, 0.08);
    }

    .article-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .priority {
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .priority.high { background: #ffe5e5; color: #b42318; }
    .priority.medium { background: #fff1d6; color: #9a6700; }
    .priority.low { background: #edf0f5; color: #667085; }

    .headline {
      font-size: 21px;
      line-height: 1.3;
      margin: 8px 0;
    }

    .meta {
      color: #687386;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .category {
      display: inline-block;
      background: #eef3ff;
      color: #3155a6;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .personalised {
      display: inline-block;
      margin-left: 7px;
      background: #edf8f2;
      color: #18794e;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: #596579;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    .summary,
    .why {
      font-size: 14px;
      line-height: 1.6;
      color: #374151;
    }

    .read {
      display: inline-block;
      margin-top: 18px;
      color: #1769e0;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .feedback {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid #edf0f4;
      margin-top: 20px;
      padding-top: 16px;
    }

    .feedback button {
      border: 1px solid #d9deea;
      background: white;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .feedback button:hover { background: #f4f6f9; }

    .feedback button.selected {
      background: #e9eefb;
      border-color: #7d91c8;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #687386;
      min-height: 16px;
    }

    .empty {
      text-align: center;
      background: white;
      border-radius: 14px;
      padding: 50px;
      color: #687386;
    }

    @media (max-width: 700px) {
      .article-top { flex-direction: column; }
      .headline { font-size: 18px; }
      .preference-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div class="brand">Salesforce News Watch</div>
      <div class="subtitle">AI-powered Salesforce intelligence feed</div>
    </div>
  </header>

  <main class="container">

    <div class="toolbar">
      <button class="filter active" onclick="filterArticles('All', this)">All</button>
      <button class="filter" onclick="filterArticles('AI & Agentforce', this)">AI & Agentforce</button>
      <button class="filter" onclick="filterArticles('Product & Platform', this)">Product</button>
      <button class="filter" onclick="filterArticles('Security / Trust', this)">Security</button>
      <button class="filter" onclick="filterArticles('M&A / Investment', this)">M&A</button>
      <button class="filter" onclick="filterArticles('Financial / Earnings', this)">Financial</button>
    </div>

    <section class="preferences" id="preferences"></section>

    <div id="news"></div>

  </main>

  <script>
    let articles = [];
    let activeFilter = "All";

    const PRIORITY_SCORE = {
      High: 3,
      Medium: 2,
      Low: 1
    };

    async function loadNews() {
      try {
        const response = await fetch("data/current.json");
        if (!response.ok) throw new Error("Unable to load current.json");

        const data = await response.json();
        articles = data.articles || [];

        renderPreferences();
        renderNews();

      } catch (error) {
        document.getElementById("news").innerHTML = `
          <div class="empty">
            Unable to load the Salesforce news data.
          </div>
        `;
        console.error(error);
      }
    }

    /*
      Reads the feedback already stored by the existing app.

      Existing keys:
      feedback_<articleId> = Like / Dislike / Ignore / Remove Source
      feedback_category_<articleId> = article category
      feedback_source_<articleId> = article source
    */
    function getUserSignals() {
      const categories = {};
      const sources = {};
      const blockedSources = new Set();

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;

        if (key.startsWith("feedback_") &&
            !key.startsWith("feedback_category_") &&
            !key.startsWith("feedback_source_")) {

          const articleId = key.replace("feedback_", "");
          const feedback = localStorage.getItem(key);
          const category = localStorage.getItem("feedback_category_" + articleId);
          const source = localStorage.getItem("feedback_source_" + articleId);

          if (!category || !source) continue;

          if (!categories[category]) categories[category] = 0;
          if (!sources[source]) sources[source] = 0;

          if (feedback === "Like") {
            categories[category] += 2;
            sources[source] += 2;
          }

          if (feedback === "Dislike") {
            categories[category] -= 2;
            sources[source] -= 2;
          }

          if (feedback === "Remove Source") {
            categories[category] -= 3;
            sources[source] -= 3;
            blockedSources.add(source);
          }
        }
      }

      return { categories, sources, blockedSources };
    }

    function preferenceLabel(score) {
      if (score >= 4) return "Strong interest";
      if (score >= 2) return "Positive";
      if (score <= -4) return "Strongly avoid";
      if (score <= -2) return "Low interest";
      return "Neutral";
    }

    function preferenceClass(score) {
      if (score > 0) return "positive";
      if (score < 0) return "negative";
      return "neutral";
    }

    function renderPreferences() {
      const signals = getUserSignals();
      const categoryEntries = Object.entries(signals.categories)
        .filter(([, score]) => score !== 0)
        .sort((a, b) => b[1] - a[1]);

      const sourceEntries = Object.entries(signals.sources)
        .filter(([, score]) => score !== 0)
        .sort((a, b) => b[1] - a[1]);

      let categoryHTML = categoryEntries.length
        ? categoryEntries.map(([name, score]) => `
            <div class="preference-item">
              <span>${escapeHTML(name)}</span>
              <span class="preference-score ${preferenceClass(score)}">
                ${preferenceLabel(score)}
              </span>
            </div>
          `).join("")
        : `<div class="neutral" style="font-size:13px;">No strong category preference yet.</div>`;

      let sourceHTML = sourceEntries.length
        ? sourceEntries.map(([name, score]) => `
            <div class="preference-item">
              <span>${escapeHTML(name)}</span>
              <span class="preference-score ${preferenceClass(score)}">
                ${score > 0 ? "Preferred" : "Reduce"}
              </span>
            </div>
          `).join("")
        : `<div class="neutral" style="font-size:13px;">No source preference yet.</div>`;

      const blockedHTML = signals.blockedSources.size
        ? Array.from(signals.blockedSources).map(source =>
            `<span class="blocked">${escapeHTML(source)}</span>`
          ).join("")
        : `<span class="neutral" style="font-size:13px;">None</span>`;

      document.getElementById("preferences").innerHTML = `
        <div class="preferences-title">Your News Preferences</div>
        <div class="preferences-subtitle">
          Based on the feedback you have given this app.
        </div>

        <div class="preference-grid">
          <div class="preference-column">
            <h4>Topics & Categories</h4>
            ${categoryHTML}
          </div>

          <div class="preference-column">
            <h4>Sources</h4>
            ${sourceHTML}
          </div>
        </div>

        <div class="preference-column" style="margin-top:18px;">
          <h4>Blocked Sources</h4>
          ${blockedHTML}
        </div>

        <div class="personalisation-note">
          Personalisation is currently based on your local feedback. 
          More feedback will make these preferences more meaningful.
        </div>
      `;
    }

    function getArticleScore(article) {
      const signals = getUserSignals();

      if (signals.blockedSources.has(article.source)) {
        return -999;
      }

      let score = PRIORITY_SCORE[article.priority] || 0;

      score += signals.categories[article.primary_category] || 0;
      score += signals.sources[article.source] || 0;

      return score;
    }

    function getWhyShown(article) {
      const signals = getUserSignals();
      const reasons = [];

      if ((signals.categories[article.primary_category] || 0) > 0) {
        reasons.push("matches a category you have liked");
      }

      if ((signals.sources[article.source] || 0) > 0) {
        reasons.push("comes from a source you have engaged positively with");
      }

      if (reasons.length === 0) {
        return "";
      }

      return "Shown because it " + reasons.join(" and ") + ".";
    }

    function renderNews() {
      const container = document.getElementById("news");

      let filtered = articles;

      if (activeFilter !== "All") {
        filtered = articles.filter(
          article => article.primary_category === activeFilter
        );
      }

      filtered = filtered
        .filter(article => getArticleScore(article) > -999)
        .sort((a, b) => getArticleScore(b) - getArticleScore(a));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty">
            No articles found for this category.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(article => {

        const feedback =
          localStorage.getItem("feedback_" + article.article_id);

        const whyShown = getWhyShown(article);

        return `
          <article class="article">

            <div class="article-top">
              <div>

                <div class="category">
                  ${escapeHTML(article.primary_category)}
                  ${whyShown ? `<span class="personalised">PERSONALISED</span>` : ""}
                </div>

                <h2 class="headline">
                  ${escapeHTML(article.headline)}
                </h2>

                <div class="meta">
                  ${escapeHTML(article.source)}
                  &nbsp;•&nbsp;
                  ${escapeHTML(article.publication_date)}
                  &nbsp;•&nbsp;
                  ${escapeHTML(article.article_type)}
                </div>

              </div>

              <div class="priority ${String(article.priority).toLowerCase()}">
                ${escapeHTML(article.priority)}
              </div>
            </div>

            <div class="label">What happened</div>

            <div class="summary">
              ${escapeHTML(article.summary)}
            </div>

            <div class="label">Why it matters</div>

            <div class="why">
              ${escapeHTML(article.why_it_matters)}
            </div>

            ${whyShown ? `
              <div class="label">Why you're seeing this</div>
              <div class="why">${escapeHTML(whyShown)}</div>
            ` : ""}

            ${
              article.url_verified &&
              article.original_url !== "NOT VERIFIED"
              ?
              `<a class="read"
                 href="${escapeHTML(article.original_url)}"
                 target="_blank"
                 rel="noopener noreferrer">
                 Read original article →
               </a>`
              :
              `<div class="meta" style="margin-top:18px;">
                 Original article URL not verified
               </div>`
            }

            <div class="feedback">

              <button
                class="${feedback === 'Like' ? 'selected' : ''}"
                onclick="giveFeedback('${escapeHTML(article.article_id)}', 'Like')">
                👍 Like
              </button>

              <button
                class="${feedback === 'Dislike' ? 'selected' : ''}"
                onclick="giveFeedback('${escapeHTML(article.article_id)}', 'Dislike')">
                👎 Don't like
              </button>

              <button
                class="${feedback === 'Ignore' ? 'selected' : ''}"
                onclick="giveFeedback('${escapeHTML(article.article_id)}', 'Ignore')">
                😐 Ignore
              </button>

              <button
                class="${feedback === 'Remove Source' ? 'selected' : ''}"
                onclick="giveFeedback('${escapeHTML(article.article_id)}', 'Remove Source')">
                🚫 Remove source
              </button>

            </div>

            <div
              class="status"
              id="status-${escapeHTML(article.article_id)}">
              ${feedback ? "Feedback recorded: " + escapeHTML(feedback) : ""}
            </div>

          </article>
        `;

      }).join("");
    }

    function filterArticles(category, button) {
      activeFilter = category;

      document.querySelectorAll(".filter").forEach(
        b => b.classList.remove("active")
      );

      button.classList.add("active");

      renderNews();
    }

    function giveFeedback(articleId, feedback) {

      localStorage.setItem(
        "feedback_" + articleId,
        feedback
      );

      const article = articles.find(
        a => a.article_id === articleId
      );

      if (article) {

        localStorage.setItem(
          "feedback_category_" + articleId,
          article.primary_category
        );

        localStorage.setItem(
          "feedback_source_" + articleId,
          article.source
        );

      }

      renderPreferences();
      renderNews();
    }

    function escapeHTML(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadNews();
  </script>

</body>
</html>
